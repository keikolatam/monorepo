[workspace]
resolver = "2"

# NOTA (Fase 0, 2026-06-09): paths corregidos a la convención apps/*.
# DEUDA PREEXISTENTE (anterior a la migración, follow-up de #2):
#   - los antiguos members `services/*-service` NO existían en disco (drift);
#     los módulos reales viven en apps/backend/modules/*.
#   - `apps/backend` depende de un crate `shared` que aún no existe.
#   - `apps/api-gateway` es un workspace anidado con members fantasma → excluido.
# El workspace raíz NO compilaba antes de esta migración; el untangling completo
# excede Fase 0 (ver revisión domain-driven-advisor en el PR).
members = [
    "apps/backend",
    "apps/backend/modules/identity",
    "apps/backend/modules/learning_passport",
    "apps/backend/modules/reputation",
    "apps/backend/modules/governance",
    "apps/backend/modules/marketplace",
    "apps/backend/modules/selfstudy_guides",
    "shared/types",
    "shared/utils"
]

exclude = [
    "apps/api-gateway",          # workspace anidado propio
    "apps/appchain/madara-cli"   # fork vendoreado, workspace propio
]

[workspace.dependencies]
# Substrate dependencies (removed for now)
parity-scale-codec = { version = "3.6.1", default-features = false, features = ["derive"] }
scale-info = { version = "2.5.0", default-features = false, features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Web frameworks  
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# GraphQL
async-graphql = "7.0"
async-graphql-axum = "7.0"

# gRPC
tonic = "0.11"
tonic-build = "0.11"
prost = "0.12"

# Database & Cache
redis = { version = "0.24", features = ["tokio-comp"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Leptos (for admin panel)
leptos = { version = "0.6" }
leptos_axum = "0.6"
leptos_meta = "0.6"
leptos_router = "0.6"

# WASM
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"